# render.yaml — CloudCRM Next.js on Render
# Docs: https://render.com/docs/infrastructure-as-code

services:
  # ── Web Application ──────────────────────────────────────────────────────────
  - type: web
    name: cloud-crm
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: singapore
    healthCheckPath: /

    envVars:
      # Next.js App
      - key: NEXT_PUBLIC_APP_NAME
        value: "CloudCRM"
      - key: NEXT_PUBLIC_APP_URL
        value: https://cloud-crm-9p5w.onrender.com
      - key: AUTH_URL
        value: https://cloud-crm-9p5w.onrender.com

      # Auth.js secrets — set in Render Dashboard
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_DISCORD_ID
        sync: false
      - key: AUTH_DISCORD_SECRET
        sync: false

      # Database — auto-populated from the database defined below
      - key: DATABASE_URL
        fromDatabase:
          name: cloud-crm-db
          property: connectionString

      # SMTP — set in Render Dashboard
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

      # Encryption key for sensitive data
      - key: ENCRYPTION_KEY
        generateValue: true

      # Cron job secret (also set in external cron service)
      - key: CRON_SECRET
        generateValue: true

      # Optional: override default admin credentials
      - key: ADMIN_EMAIL
        value: "admin@cloudcrm.app"
      - key: ADMIN_PASSWORD
        sync: false

      # Node environment
      - key: NODE_ENV
        value: production

  # ── Cron Job: billing cycles ─────────────────────────────────────────────────
  # To enable: call POST https://cloud-crm-9p5w.onrender.com/api/cron/billing
  # with header x-cron-secret matching CRON_SECRET env var.
  # Schedule via cron-job.org or similar external service.

databases:
  # ── PostgreSQL database ───────────────────────────────────────────────────────
  - name: cloud-crm-db
    plan: free
    databaseName: cloudcrm
    user: cloudcrm
    region: singapore
