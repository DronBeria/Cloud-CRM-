# render.yaml — Cloud CRM on Render
# Docs: https://render.com/docs/infrastructure-as-code

services:
  # ── Web Application ──────────────────────────────────────────────────────────
  - type: web
    name: cloud-crm
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter               # change to 'standard' or higher for production
    region: singapore           # closest to India; also try oregon/frankfurt
    healthCheckPath: /

    envVars:
      # Application
      - key: APP_NAME
        value: "Cloud CRM"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true     # Render auto-generates a secure key
      - key: APP_URL
        value: https://cloud-crm.onrender.com   # update after first deploy

      # Database — auto-populated from the database defined below
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: cloud-crm-db
          property: connectionString

      # Parse DATABASE_URL into individual components (used by config/database.php)
      - key: DB_HOST
        fromDatabase:
          name: cloud-crm-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: cloud-crm-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: cloud-crm-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: cloud-crm-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: cloud-crm-db
          property: password

      # Drivers — database is simplest for single-instance Render free tier
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database

      # Telemetry off by default
      - key: TELEMETRY_ENABLED
        value: "false"

      # ── Set these manually in Render Dashboard → Environment ──────────────
      # Mail
      - key: MAIL_MAILER
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false

      # Stripe
      - key: STRIPE_KEY
        sync: false
      - key: STRIPE_SECRET
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

      # PayPal
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false

      # Google Drive Backup extension
      - key: GDRIVE_GOOGLE_CLIENT_ID
        sync: false
      - key: GDRIVE_GOOGLE_CLIENT_SECRET
        sync: false

    # Persistent disk for uploads / storage
    disk:
      name: cloud-crm-storage
      mountPath: /var/www/html/storage
      sizeGB: 10               # increase as needed

  # ── Cron Job: daily billing & suspension ─────────────────────────────────────
  # Disabled by default — the in-container scheduler handles this.
  # Uncomment if you want a separate Render cron service instead.
  #
  # - type: cron
  #   name: cloud-crm-cron
  #   runtime: docker
  #   dockerfilePath: ./Dockerfile
  #   plan: starter
  #   schedule: "0 0 * * *"
  #   startCommand: php artisan schedule:run --no-interaction

databases:
  # ── PostgreSQL database ───────────────────────────────────────────────────────
  - name: cloud-crm-db
    plan: free                 # upgrade to 'starter' for production (free tier has limits)
    databaseName: cloudcrm
    user: cloudcrm
    region: singapore
